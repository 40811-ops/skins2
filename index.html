<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script src="./assets/js/index.js" defer></script>
  </head>
  <body>
    <main>
      <section id="cadastro">
        <form action="#">
          <h2>Cadastro</h2>

          <input
            type="text"
            maxlength="10"
            placeholder="usuario"
            required
            class="campo"
            name="fusuario"
          />

          <input
            type="email"
            maxlength="70"
            placeholder="E-mail"
            required
            class="campo"
            name="femail"
          />

          <input
            type="password"
            maxlength="12"
            minlength="8"
            placeholder="Senha"
            required
            class="campo"
            name="fsenha"
          />

          <input
            type="password"
            maxlength="12"
            minlength="8"
            placeholder="Senha"
            required
            class="campo"
            name="fsenha2"
          />

          <button class="campo botao">Cadastrar</button>
          <a href="#" class="alternar">Já tem conta? Entre!</a>
        </form>
      </section>

      <section id="login">
        <form action="#">
          <h2>Login</h2>

          <input
            type="email"
            maxlength="70"
            placeholder="E-mail"
            required
            class="campo"
            name="femail"
          />

          <input
            type="password"
            maxlength="12"
            minlength="8"
            placeholder="Senha"
            required
            class="campo"
            name="fsenha"
          />

          <button class="campo botao">Login</button>
          <a href="#" class="alternar">Criar Conta</a>
        </form>
      </section>
    </main>
  </body>
</html>
